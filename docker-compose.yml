services:
  db:
    image: postgres:16
    container_name: techarena-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: techarena
      POSTGRES_USER: techarena
      POSTGRES_PASSWORD: techarena_dev_password
    ports:
      - "5432:5432"
    volumes:
      - techarena_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U techarena -d techarena"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  techarena_pgdata:
